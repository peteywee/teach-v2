name: Application Interface Authority

on:
  pull_request:
    paths:
      - 'application-interfaces/**'
      - 'scripts/application-interfaces/**'
  push:
    branches: [main]
    paths:
      - 'application-interfaces/**'
      - 'scripts/application-interfaces/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/application-interfaces/validate-application-interface-authority.mjs
      - run: node scripts/application-interfaces/audit-architecture-application.mjs
