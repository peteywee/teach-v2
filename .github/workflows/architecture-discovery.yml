name: Architecture Discovery

on:
  pull_request:
    paths:
      - 'scripts/verification/**'
      - 'verification/workflow-lifecycle/**'
      - 'scripts/tests/validate-workflow-lifecycle.test.mjs'
      - '.github/workflows/architecture-discovery.yml'
      - 'architecture/**'
      - 'scripts/architecture/validate-architecture-discovery.mjs'
  push:
    branches: [main]
    paths:
      - 'scripts/verification/**'
      - 'verification/workflow-lifecycle/**'
      - 'scripts/tests/validate-workflow-lifecycle.test.mjs'
      - '.github/workflows/architecture-discovery.yml'
      - 'architecture/**'
      - 'scripts/architecture/validate-architecture-discovery.mjs'

permissions:
  contents: read

jobs:
  validate-architecture-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        id: workflow_step_001
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Pin lifecycle Node runtime
        id: workflow_step_002
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate architecture discovery
        id: workflow_step_003
        run: node scripts/architecture/validate-architecture-discovery.mjs
      - name: Record workflow lifecycle checkpoint
        id: lifecycle_record
        if: always()
        env:
          LIFECYCLE_STEPS: ${{ toJson(steps) }}
          LIFECYCLE_JOB_STATUS: ${{ job.status }}
          LIFECYCLE_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          LIFECYCLE_WORKFLOW_PATH: .github/workflows/architecture-discovery.yml
        run: node scripts/verification/record-workflow-lifecycle.mjs
      - name: Retain workflow lifecycle evidence
        id: lifecycle_upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: verification/generated/workflow-lifecycle/report.json
          if-no-files-found: error
