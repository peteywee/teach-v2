name: Decision Table Discovery

on:
  pull_request:
    paths:
      - 'domains/decisions/**'
      - 'kernel/**'
      - 'contracts/**'
      - 'scripts/domains/validate-decision-table-discovery.mjs'
  push:
    branches: [main]
    paths:
      - 'domains/decisions/**'
      - 'kernel/**'
      - 'contracts/**'
      - 'scripts/domains/validate-decision-table-discovery.mjs'

permissions:
  contents: read

jobs:
  validate-decision-table-discovery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate decision-table discovery
        run: node scripts/domains/validate-decision-table-discovery.mjs
