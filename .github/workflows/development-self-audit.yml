name: Development Self Audit
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  self-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: teach_v2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d teach_v2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/teach_v2
      TEACH_ISOLATED_DB: '1'
      AUDIT_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        id: workflow_step_001
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        id: workflow_step_002
        with:
          node-version: '20.20.2'
      - name: Enable pinned pnpm
        id: workflow_step_003
        run: |
          corepack enable
          corepack prepare pnpm@12.8.1 --activate
      - name: Install frozen dependencies
        id: workflow_step_004
        run: pnpm install --frozen-lockfile
      - name: Audit authority
        id: audit_authority
        run: node scripts/verification/run-self-audit.mjs --stage authority
      - name: Audit demo-registration-entry-regressions
        id: audit_demo_registration_entry_regressions
        run: node scripts/verification/run-self-audit.mjs --stage demo-registration-entry-regressions
      - name: Audit demo-registration-regressions
        id: audit_demo_registration_regressions
        run: node scripts/verification/run-self-audit.mjs --stage demo-registration-regressions
      - name: Audit document-governance
        id: audit_document_governance
        run: node scripts/verification/run-self-audit.mjs --stage document-governance
      - name: Audit production-contract-decisions
        id: audit_production_contract_decisions
        run: node scripts/verification/run-self-audit.mjs --stage production-contract-decisions
      - name: Audit pins
        id: audit_pins
        run: node scripts/verification/run-self-audit.mjs --stage pins
      - name: Audit target-snapshots
        id: audit_target_snapshots
        run: node scripts/verification/run-self-audit.mjs --stage target-snapshots
      - name: Audit production-denials
        id: audit_production_denials
        run: node scripts/verification/run-self-audit.mjs --stage production-denials
      - name: Audit migration-guards
        id: audit_migration_guards
        run: node scripts/verification/run-self-audit.mjs --stage migration-guards
      - name: Audit apply-regressions
        id: audit_apply_regressions
        run: node scripts/verification/run-self-audit.mjs --stage apply-regressions
      - name: Audit validator-shard-1
        id: audit_validator_shard_1
        run: node scripts/verification/run-self-audit.mjs --stage validator-shard-1
      - name: Audit validator-shard-2
        id: audit_validator_shard_2
        run: node scripts/verification/run-self-audit.mjs --stage validator-shard-2
      - name: Audit validator-shard-3
        id: audit_validator_shard_3
        run: node scripts/verification/run-self-audit.mjs --stage validator-shard-3
      - name: Audit validator-shard-4
        id: audit_validator_shard_4
        run: node scripts/verification/run-self-audit.mjs --stage validator-shard-4
      - name: Audit validator-shard-5
        id: audit_validator_shard_5
        run: node scripts/verification/run-self-audit.mjs --stage validator-shard-5
      - name: Audit validator-shard-6
        id: audit_validator_shard_6
        run: node scripts/verification/run-self-audit.mjs --stage validator-shard-6
      - name: Audit validator-shard-7
        id: audit_validator_shard_7
        run: node scripts/verification/run-self-audit.mjs --stage validator-shard-7
      - name: Audit validator-shard-8
        id: audit_validator_shard_8
        run: node scripts/verification/run-self-audit.mjs --stage validator-shard-8
      - name: Audit validator-shard-9
        id: audit_validator_shard_9
        run: node scripts/verification/run-self-audit.mjs --stage validator-shard-9
      - name: Audit validator-shard-10
        id: audit_validator_shard_10
        run: node scripts/verification/run-self-audit.mjs --stage validator-shard-10
      - name: Audit validator-shard-11
        id: audit_validator_shard_11
        run: node scripts/verification/run-self-audit.mjs --stage validator-shard-11
      - name: Audit validator-shard-12
        id: audit_validator_shard_12
        run: node scripts/verification/run-self-audit.mjs --stage validator-shard-12
      - name: Audit validator-shard-13
        id: audit_validator_shard_13
        run: node scripts/verification/run-self-audit.mjs --stage validator-shard-13
      - name: Audit validator-shard-14
        id: audit_validator_shard_14
        run: node scripts/verification/run-self-audit.mjs --stage validator-shard-14
      - name: Audit audit-regressions
        id: audit_audit_regressions
        run: node scripts/verification/run-self-audit.mjs --stage audit-regressions
      - name: Audit recovery-regressions
        id: audit_recovery_regressions
        run: node scripts/verification/run-self-audit.mjs --stage recovery-regressions
      - name: Audit lifecycle-regressions
        id: audit_lifecycle_regressions
        run: node scripts/verification/run-self-audit.mjs --stage lifecycle-regressions
      - name: Audit demo-source-tests
        id: audit_demo_source_tests
        run: node scripts/verification/run-self-audit.mjs --stage demo-source-tests
      - name: Audit demo-generation
        id: audit_demo_generation
        run: node scripts/verification/run-self-audit.mjs --stage demo-generation
      - name: Audit demo-postgres
        id: audit_demo_postgres
        run: node scripts/verification/run-self-audit.mjs --stage demo-postgres
      - name: Audit demo-recipe-postgres
        id: audit_demo_recipe_postgres
        run: node scripts/verification/run-self-audit.mjs --stage demo-recipe-postgres
      - name: Audit typecheck
        id: audit_typecheck
        run: node scripts/verification/run-self-audit.mjs --stage typecheck
      - name: Audit foundation
        id: audit_foundation
        run: node scripts/verification/run-self-audit.mjs --stage foundation
      - name: Audit drizzle-history
        id: audit_drizzle_history
        run: node scripts/verification/run-self-audit.mjs --stage drizzle-history
      - name: Audit generation
        id: audit_generation
        run: node scripts/verification/run-self-audit.mjs --stage generation
      - name: Audit replay-p01
        id: audit_replay_p01
        run: node scripts/verification/run-self-audit.mjs --stage replay-p01
      - name: Audit replay-p02
        id: audit_replay_p02
        run: node scripts/verification/run-self-audit.mjs --stage replay-p02
      - name: Audit replay-p03
        id: audit_replay_p03
        run: node scripts/verification/run-self-audit.mjs --stage replay-p03
      - name: Audit replay-p04
        id: audit_replay_p04
        run: node scripts/verification/run-self-audit.mjs --stage replay-p04
      - name: Audit replay
        id: audit_replay
        run: node scripts/verification/run-self-audit.mjs --stage replay
      - name: Audit migrate-isolated
        id: audit_migrate_isolated
        run: node scripts/verification/run-self-audit.mjs --stage migrate-isolated
      - name: Audit postgres-p01
        id: audit_postgres_p01
        run: node scripts/verification/run-self-audit.mjs --stage postgres-p01
      - name: Audit postgres-p02
        id: audit_postgres_p02
        run: node scripts/verification/run-self-audit.mjs --stage postgres-p02
      - name: Audit postgres-identity-commands
        id: audit_postgres_identity_commands
        run: node scripts/verification/run-self-audit.mjs --stage postgres-identity-commands
      - name: Audit postgres-session-commands
        id: audit_postgres_session_commands
        run: node scripts/verification/run-self-audit.mjs --stage postgres-session-commands
      - name: Audit postgres-p03
        id: audit_postgres_p03
        run: node scripts/verification/run-self-audit.mjs --stage postgres-p03
      - name: Audit postgres-p04
        id: audit_postgres_p04
        run: node scripts/verification/run-self-audit.mjs --stage postgres-p04
      - name: Audit postgres-p05
        id: audit_postgres_p05
        run: node scripts/verification/run-self-audit.mjs --stage postgres-p05
      - name: Reconcile exact-source evidence
        id: audit_finalize
        if: always()
        run: node scripts/verification/run-self-audit.mjs --finish
      - name: Save audit evidence
        id: audit_upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: development-self-audit-${{ github.event.pull_request.head.sha || github.sha }}
          path: verification/generated/self-audit/
          if-no-files-found: error
      - name: Pin additional hosted-source Node runtime
        id: hosted_node24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.19.0'
      - name: Enable pinned pnpm for Node24 checks
        id: hosted_pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.8.1 --activate
      - name: Verify schema source controls
        id: hosted_schema
        run: pnpm exec node scripts/verification/run-hosted-source-check.mjs schema
      - name: Verify disabled hosted runtime and adapter
        id: hosted_hosted
        run: pnpm exec node scripts/verification/run-hosted-source-check.mjs hosted
      - name: Verify disabled Node24 package
        id: hosted_package
        run: pnpm exec node scripts/verification/run-hosted-source-check.mjs package
      - name: Verify disabled successor controls
        id: hosted_successor
        run: pnpm exec node scripts/verification/run-hosted-source-check.mjs successor
      - name: Verify reproducible successor package
        id: hosted_successor_package
        run: pnpm exec node scripts/verification/run-hosted-source-check.mjs successor_package
      - name: Verify isolated model catalog equivalence
        id: hosted_successor_model
        run: pnpm exec node scripts/verification/run-hosted-source-check.mjs successor_model
      - name: Verify nonowner successor PostgreSQL runtime
        id: hosted_successor_postgres
        run: pnpm exec node scripts/verification/run-hosted-source-check.mjs successor_postgres
      - name: Verify opt-in accepting artifact
        id: hosted_accepting_package
        run: pnpm exec node scripts/verification/run-hosted-source-check.mjs accepting_package
      - name: Verify packaged accepting PostgreSQL runtime
        id: hosted_accepting_postgres
        run: pnpm exec node scripts/verification/run-hosted-source-check.mjs accepting_postgres
      - name: Retain hosted source evidence
        id: hosted_upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hosted-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: verification/generated/hosted-source/
          if-no-files-found: error
      - name: Restore historical lifecycle Node runtime
        id: hosted_restore_node20
        if: always()
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '20.20.2'
      - name: Record workflow lifecycle checkpoint
        id: lifecycle_record
        if: always()
        env:
          LIFECYCLE_STEPS: ${{ toJson(steps) }}
          LIFECYCLE_JOB_STATUS: ${{ job.status }}
          LIFECYCLE_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          LIFECYCLE_WORKFLOW_PATH: .github/workflows/development-self-audit.yml
        run: node scripts/verification/record-workflow-lifecycle.mjs
      - name: Retain workflow lifecycle evidence
        id: lifecycle_upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: workflow-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: verification/generated/workflow-lifecycle/report.json
          if-no-files-found: error
