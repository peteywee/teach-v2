name: First Physical Slice Readiness

on:
  pull_request:
    paths:
      - 'scripts/persistence/admission-criteria.mjs'
      - 'persistence/authority.json'
      - 'persistence/physical-slices/**'
      - 'scripts/persistence/validate-first-physical-slice-readiness.mjs'
      - 'scripts/persistence/audit-first-physical-slice-readiness.mjs'
      - 'scripts/persistence/validate-slice-p01-schema-admission.mjs'
  push:
    branches: [main]
    paths:
      - 'scripts/persistence/admission-criteria.mjs'
      - 'persistence/authority.json'
      - 'persistence/physical-slices/**'
      - 'scripts/persistence/validate-first-physical-slice-readiness.mjs'
      - 'scripts/persistence/audit-first-physical-slice-readiness.mjs'
      - 'scripts/persistence/validate-slice-p01-schema-admission.mjs'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/persistence/validate-first-physical-slice-readiness.mjs
      - run: node scripts/persistence/audit-first-physical-slice-readiness.mjs
      - run: node scripts/persistence/validate-slice-p01-schema-admission.mjs

