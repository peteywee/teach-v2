name: Persistence Semantic Closure Registration

on:
  pull_request:
    paths:
      - 'kernel/**'
      - 'persistence/semantic-closure/**'
      - 'scripts/persistence/validate-persistence-semantic-closure-registration.mjs'
  push:
    branches: [main]
    paths:
      - 'kernel/**'
      - 'persistence/semantic-closure/**'
      - 'scripts/persistence/validate-persistence-semantic-closure-registration.mjs'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/persistence/validate-persistence-semantic-closure-registration.mjs
