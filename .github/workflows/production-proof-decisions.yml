name: Production Proof Decisions

on:
  pull_request:
    paths:
      - 'scripts/verification/**'
      - 'verification/workflow-lifecycle/**'
      - 'scripts/tests/validate-workflow-lifecycle.test.mjs'
      - '.github/workflows/production-proof-decisions.yml'
      - 'contracts/**'
      - 'production-proof/**'
      - 'scripts/release/**'
      - 'scripts/tests/validate-production-proof.mjs'
      - 'scripts/governance/validate-strict-nine-ratification.mjs'
      - 'scripts/persistence/validate-slice-p01-relationship-promotion.mjs'
      - 'scripts/tests/validate-apply-guard-regressions.mjs'
      - '.github/workflows/production-proof-decisions.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/verification/**'
      - 'verification/workflow-lifecycle/**'
      - 'scripts/tests/validate-workflow-lifecycle.test.mjs'
      - '.github/workflows/production-proof-decisions.yml'
      - 'contracts/**'
      - 'production-proof/**'
      - 'scripts/release/**'
      - 'scripts/tests/validate-production-proof.mjs'
      - 'scripts/governance/validate-strict-nine-ratification.mjs'
      - 'scripts/persistence/validate-slice-p01-relationship-promotion.mjs'
      - 'scripts/tests/validate-apply-guard-regressions.mjs'
      - '.github/workflows/production-proof-decisions.yml'

permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        id: workflow_step_001
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        id: workflow_step_002
        with:
          node-version: '20'
      - name: Validate owner decisions
        id: workflow_step_003
        run: node scripts/release/validate-production-proof-contract-decisions.mjs
      - name: Test production-proof gates
        id: workflow_step_004
        run: node scripts/tests/validate-production-proof.mjs
      - name: Record workflow lifecycle checkpoint
        id: lifecycle_record
        if: always()
        env:
          LIFECYCLE_STEPS: ${{ toJson(steps) }}
          LIFECYCLE_JOB_STATUS: ${{ job.status }}
          LIFECYCLE_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          LIFECYCLE_WORKFLOW_PATH: .github/workflows/production-proof-decisions.yml
        run: node scripts/verification/record-workflow-lifecycle.mjs
      - name: Retain workflow lifecycle evidence
        id: lifecycle_upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: verification/generated/workflow-lifecycle/report.json
          if-no-files-found: error
