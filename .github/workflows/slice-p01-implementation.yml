name: SLICE-P01 Implementation

on:
  pull_request:
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/slice-p01-implementation.yml'
      - 'tsconfig.json'
      - 'drizzle.config.ts'
      - 'drizzle/**'
      - 'src/modules/transaction-control/**'
      - 'tests/integration/transaction-control/**'
      - 'scripts/db/**'
      - 'scripts/persistence/validate-slice-p01-implementation-boundary.mjs'
      - 'persistence/physical-slices/transaction-control/implementation.json'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/slice-p01-implementation.yml'
      - 'tsconfig.json'
      - 'drizzle.config.ts'
      - 'drizzle/**'
      - 'src/modules/transaction-control/**'
      - 'tests/integration/transaction-control/**'
      - 'scripts/db/**'
      - 'scripts/persistence/validate-slice-p01-implementation-boundary.mjs'
      - 'persistence/physical-slices/transaction-control/implementation.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: teach_v2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d teach_v2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/teach_v2
      TEACH_ISOLATED_DB: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.8.1 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Drizzle migration history
        run: pnpm exec drizzle-kit check
      - name: Typecheck
        run: pnpm typecheck
      - name: Domain tests
        run: pnpm test
      - name: Validate implementation boundary
        run: pnpm validate:slice-p01
      - name: Verify empty-database migration replay
        run: pnpm db:verify-replay
      - name: Apply migration to isolated CI test database
        run: pnpm db:migrate
      - name: PostgreSQL integration tests
        run: pnpm test:integration
