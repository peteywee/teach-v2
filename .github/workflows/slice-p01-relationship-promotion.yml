name: SLICE-P01 Relationship Promotion

on:
  pull_request:
    paths:
      - 'kernel/manifest.json'
      - 'kernel/relationships.json'
      - 'kernel/README.md'
      - 'contracts/README.md'
      - 'contracts/APPROVAL-RECORD.md'
      - 'persistence/physical-slices/readiness.json'
      - 'persistence/physical-slices/transaction-control/relationship-promotion.json'
      - 'scripts/persistence/validate-slice-p01-relationship-promotion.mjs'
  push:
    branches: [main]
    paths:
      - 'kernel/manifest.json'
      - 'kernel/relationships.json'
      - 'kernel/README.md'
      - 'contracts/README.md'
      - 'contracts/APPROVAL-RECORD.md'
      - 'persistence/physical-slices/readiness.json'
      - 'persistence/physical-slices/transaction-control/relationship-promotion.json'
      - 'scripts/persistence/validate-slice-p01-relationship-promotion.mjs'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/persistence/validate-slice-p01-relationship-promotion.mjs
