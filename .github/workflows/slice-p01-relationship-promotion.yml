name: SLICE-P01 Relationship Promotion

on:
  pull_request:
    paths:
      - 'scripts/verification/**'
      - 'verification/workflow-lifecycle/**'
      - 'scripts/tests/validate-workflow-lifecycle.test.mjs'
      - '.github/workflows/slice-p01-relationship-promotion.yml'
      - 'kernel/manifest.json'
      - 'kernel/relationships.json'
      - 'kernel/README.md'
      - 'contracts/README.md'
      - 'contracts/APPROVAL-RECORD.md'
      - 'persistence/physical-slices/readiness.json'
      - 'persistence/physical-slices/transaction-control/relationship-promotion.json'
      - 'scripts/persistence/validate-slice-p01-relationship-promotion.mjs'
  push:
    branches: [main]
    paths:
      - 'scripts/verification/**'
      - 'verification/workflow-lifecycle/**'
      - 'scripts/tests/validate-workflow-lifecycle.test.mjs'
      - '.github/workflows/slice-p01-relationship-promotion.yml'
      - 'kernel/manifest.json'
      - 'kernel/relationships.json'
      - 'kernel/README.md'
      - 'contracts/README.md'
      - 'contracts/APPROVAL-RECORD.md'
      - 'persistence/physical-slices/readiness.json'
      - 'persistence/physical-slices/transaction-control/relationship-promotion.json'
      - 'scripts/persistence/validate-slice-p01-relationship-promotion.mjs'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        id: workflow_step_001
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Pin lifecycle Node runtime
        id: workflow_step_002
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/persistence/validate-slice-p01-relationship-promotion.mjs
        id: workflow_step_003
      - name: Record workflow lifecycle checkpoint
        id: lifecycle_record
        if: always()
        env:
          LIFECYCLE_STEPS: ${{ toJson(steps) }}
          LIFECYCLE_JOB_STATUS: ${{ job.status }}
          LIFECYCLE_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          LIFECYCLE_WORKFLOW_PATH: .github/workflows/slice-p01-relationship-promotion.yml
        run: node scripts/verification/record-workflow-lifecycle.mjs
      - name: Retain workflow lifecycle evidence
        id: lifecycle_upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: verification/generated/workflow-lifecycle/report.json
          if-no-files-found: error
