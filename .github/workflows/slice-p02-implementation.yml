name: SLICE-P02 Implementation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: teach_v2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d teach_v2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/teach_v2
      TEACH_ISOLATED_DB: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.8.1 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Drizzle migration history
        run: pnpm exec drizzle-kit check
      - name: Typecheck
        run: pnpm typecheck
      - name: P02 domain and service tests
        run: pnpm test:p02
      - name: Validate P02 decision and implementation boundaries
        run: |
          node scripts/persistence/validate-slice-p02-owner-decisions.mjs
          node scripts/persistence/validate-slice-p02-schema-admission.mjs
          pnpm validate:slice-p02
      - name: Verify empty and P01-to-P02 migration replay
        run: pnpm db:verify-p02-replay
      - name: Apply committed history to isolated CI database
        run: pnpm db:migrate
      - name: PostgreSQL integration tests
        run: pnpm test:p02:integration
      - name: Atomic Identity command mechanisms
        run: pnpm test:identity:commands:integration
      - name: Atomic Session command mechanisms
        run: pnpm test:session:commands:integration
