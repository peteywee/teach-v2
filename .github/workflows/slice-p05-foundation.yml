name: SLICE-P05 Domain Application Foundation

on:
  pull_request:
    paths:
      - 'scripts/verification/**'
      - 'verification/workflow-lifecycle/**'
      - 'scripts/tests/validate-workflow-lifecycle.test.mjs'
      - '.github/workflows/slice-p05-foundation.yml'
      - 'scripts/persistence/learning-implementation-evidence.mjs'
      - 'scripts/persistence/validate-slice-p05-implementation-boundary.mjs'
      - 'src/bootstrap/learning-persistence-schema.ts'
      - 'scripts/persistence/admission-criteria.mjs'
      - 'persistence/authority.json'
      - 'src/modules/learning/**'
      - 'kernel/**'
      - 'persistence/physical-slices/learning-session/**'
      - 'scripts/persistence/validate-slice-p05-foundation.mjs'
      - 'scripts/persistence/learning-foundation-evidence.mjs'
      - 'scripts/packaging/migration-history-guards.mjs'
      - 'scripts/packaging/validate-apply-guards.mjs'
      - 'scripts/tests/validate-validators.mjs'
      - 'persistence/physical-slices/readiness.json'
      - 'drizzle/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/slice-p05-foundation.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/verification/**'
      - 'verification/workflow-lifecycle/**'
      - 'scripts/tests/validate-workflow-lifecycle.test.mjs'
      - '.github/workflows/slice-p05-foundation.yml'
      - 'scripts/persistence/learning-implementation-evidence.mjs'
      - 'scripts/persistence/validate-slice-p05-implementation-boundary.mjs'
      - 'src/bootstrap/learning-persistence-schema.ts'
      - 'scripts/persistence/admission-criteria.mjs'
      - 'persistence/authority.json'
      - 'src/modules/learning/**'
      - 'kernel/**'
      - 'persistence/physical-slices/learning-session/**'
      - 'scripts/persistence/validate-slice-p05-foundation.mjs'
      - 'scripts/persistence/learning-foundation-evidence.mjs'
      - 'scripts/packaging/migration-history-guards.mjs'
      - 'scripts/packaging/validate-apply-guards.mjs'
      - 'scripts/tests/validate-validators.mjs'
      - 'persistence/physical-slices/readiness.json'
      - 'drizzle/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/slice-p05-foundation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        id: workflow_step_001
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        id: workflow_step_002
        with:
          node-version: '20'
      - name: Enable repository-pinned pnpm
        id: workflow_step_003
        run: |
          corepack enable
          corepack prepare pnpm@12.8.1 --activate
      - name: Install exact dependencies
        id: workflow_step_004
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        id: workflow_step_005
        run: pnpm typecheck
      - name: Verify lifecycle, authorization denial, and scope behavior
        id: workflow_step_006
        run: pnpm test:p05:foundation
      - name: Verify P05 admission and preserved physical totals
        id: workflow_step_007
        run: |
          node scripts/persistence/validate-slice-p05-foundation.mjs
          node scripts/persistence/validate-slice-p05-owner-decisions.mjs
          node scripts/persistence/validate-slice-p05-schema-admission.mjs
          node scripts/persistence/validate-first-physical-slice-readiness.mjs
          node scripts/persistence/audit-first-physical-slice-readiness.mjs
          node scripts/packaging/validate-apply-guards.mjs pins
      - name: Record workflow lifecycle checkpoint
        id: lifecycle_record
        if: always()
        env:
          LIFECYCLE_STEPS: ${{ toJson(steps) }}
          LIFECYCLE_JOB_STATUS: ${{ job.status }}
          LIFECYCLE_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          LIFECYCLE_WORKFLOW_PATH: .github/workflows/slice-p05-foundation.yml
        run: node scripts/verification/record-workflow-lifecycle.mjs
      - name: Retain workflow lifecycle evidence
        id: lifecycle_upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: verification/generated/workflow-lifecycle/report.json
          if-no-files-found: error
