name: SLICE-P05 Physical Implementation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: teach_v2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d teach_v2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/teach_v2
      TEACH_ISOLATED_DB: '1'
    steps:
      - uses: actions/checkout@v4
        id: workflow_step_001
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        id: workflow_step_002
        with:
          node-version: '20'
      - name: Enable pinned pnpm and install exact dependencies
        id: workflow_step_003
        run: |
          corepack enable
          corepack prepare pnpm@12.8.1 --activate
          pnpm install --frozen-lockfile
      - name: Typecheck
        id: workflow_step_004
        run: pnpm typecheck
      - name: Verify pinned Drizzle generation and history
        id: workflow_step_005
        run: |
          pnpm exec drizzle-kit check
          pnpm db:verify-p05-generation
      - name: Verify Domain and Application foundation
        id: workflow_step_006
        run: pnpm test:p05:foundation
      - name: Verify admission, ownership, and evidence boundaries
        id: workflow_step_007
        run: |
          node scripts/persistence/validate-slice-p05-owner-decisions.mjs
          node scripts/persistence/validate-slice-p05-schema-admission.mjs
          pnpm validate:slice-p05
          node scripts/persistence/validate-slice-p05-foundation.mjs
          node scripts/persistence/validate-first-physical-slice-readiness.mjs
          node scripts/persistence/audit-first-physical-slice-readiness.mjs
          node scripts/packaging/validate-apply-guards.mjs pins
      - name: Verify empty and P04-to-P05 replay
        id: workflow_step_008
        run: pnpm db:verify-p05-replay
      - name: Apply immutable history to isolated CI database
        id: workflow_step_009
        run: pnpm db:migrate
      - name: PostgreSQL reference, scope, lifecycle, and concurrent completion tests
        id: workflow_step_010
        run: pnpm test:p05:integration
      - name: Record workflow lifecycle checkpoint
        id: lifecycle_record
        if: always()
        env:
          LIFECYCLE_STEPS: ${{ toJson(steps) }}
          LIFECYCLE_JOB_STATUS: ${{ job.status }}
          LIFECYCLE_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          LIFECYCLE_WORKFLOW_PATH: .github/workflows/slice-p05-implementation.yml
        run: node scripts/verification/record-workflow-lifecycle.mjs
      - name: Retain workflow lifecycle evidence
        id: lifecycle_upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: verification/generated/workflow-lifecycle/report.json
          if-no-files-found: error
