name: SLICE-P05 Schema Admission

on:
  pull_request:
    paths:
      - 'persistence/physical-slices/learning-session/**'
      - 'persistence/physical-slices/readiness.json'
      - 'kernel/entities.json'
      - 'kernel/identifiers.json'
      - 'kernel/states.json'
      - 'kernel/state-machines.json'
      - 'kernel/relationships.json'
      - 'domains/ownership-map.json'
      - 'architecture/authority.json'
      - 'contracts/c32-learning-sessions-progress-contract.md'
      - 'src/modules/learning/**'
      - 'scripts/persistence/validate-slice-p05-owner-decisions.mjs'
      - 'scripts/persistence/validate-slice-p05-schema-admission.mjs'
      - 'scripts/persistence/validate-first-physical-slice-readiness.mjs'
      - 'scripts/persistence/audit-first-physical-slice-readiness.mjs'
      - 'scripts/tests/validate-validators.mjs'
      - '.github/workflows/slice-p05-schema-admission.yml'
  push:
    branches: [main]
    paths:
      - 'persistence/physical-slices/learning-session/**'
      - 'persistence/physical-slices/readiness.json'
      - 'kernel/entities.json'
      - 'kernel/identifiers.json'
      - 'kernel/states.json'
      - 'kernel/state-machines.json'
      - 'kernel/relationships.json'
      - 'domains/ownership-map.json'
      - 'architecture/authority.json'
      - 'contracts/c32-learning-sessions-progress-contract.md'
      - 'src/modules/learning/**'
      - 'scripts/persistence/validate-slice-p05-owner-decisions.mjs'
      - 'scripts/persistence/validate-slice-p05-schema-admission.mjs'
      - 'scripts/persistence/validate-first-physical-slice-readiness.mjs'
      - 'scripts/persistence/audit-first-physical-slice-readiness.mjs'
      - 'scripts/tests/validate-validators.mjs'
      - '.github/workflows/slice-p05-schema-admission.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate SLICE-P05 owner decision
        run: node scripts/persistence/validate-slice-p05-owner-decisions.mjs
      - name: Validate SLICE-P05 schema admission
        run: node scripts/persistence/validate-slice-p05-schema-admission.mjs
      - name: Validate physical-slice readiness
        run: node scripts/persistence/validate-first-physical-slice-readiness.mjs
      - name: Audit whole-stack persistence state
        run: node scripts/persistence/audit-first-physical-slice-readiness.mjs
