# Exact-head gate: owner decision -> schema admission -> readiness -> whole-stack audit
name: SLICE-P05 Schema Admission

on:
  pull_request:
    paths:
      - 'scripts/verification/**'
      - 'verification/workflow-lifecycle/**'
      - 'scripts/tests/validate-workflow-lifecycle.test.mjs'
      - '.github/workflows/slice-p05-schema-admission.yml'
      - 'scripts/persistence/learning-implementation-evidence.mjs'
      - 'scripts/persistence/validate-slice-p05-implementation-boundary.mjs'
      - 'src/bootstrap/learning-persistence-schema.ts'
      - 'scripts/persistence/admission-criteria.mjs'
      - 'persistence/authority.json'
      - 'persistence/physical-slices/learning-session/**'
      - 'persistence/physical-slices/readiness.json'
      - 'kernel/entities.json'
      - 'kernel/identifiers.json'
      - 'kernel/states.json'
      - 'kernel/state-machines.json'
      - 'kernel/relationships.json'
      - 'domains/ownership-map.json'
      - 'architecture/authority.json'
      - 'contracts/c32-learning-sessions-progress-contract.md'
      - 'src/modules/learning/**'
      - 'scripts/persistence/validate-slice-p05-owner-decisions.mjs'
      - 'scripts/persistence/validate-slice-p05-schema-admission.mjs'
      - 'scripts/persistence/validate-first-physical-slice-readiness.mjs'
      - 'scripts/persistence/audit-first-physical-slice-readiness.mjs'
      - 'scripts/tests/validate-validators.mjs'
      - '.github/workflows/slice-p05-schema-admission.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/verification/**'
      - 'verification/workflow-lifecycle/**'
      - 'scripts/tests/validate-workflow-lifecycle.test.mjs'
      - '.github/workflows/slice-p05-schema-admission.yml'
      - 'scripts/persistence/learning-implementation-evidence.mjs'
      - 'scripts/persistence/validate-slice-p05-implementation-boundary.mjs'
      - 'src/bootstrap/learning-persistence-schema.ts'
      - 'scripts/persistence/admission-criteria.mjs'
      - 'persistence/authority.json'
      - 'persistence/physical-slices/learning-session/**'
      - 'persistence/physical-slices/readiness.json'
      - 'kernel/entities.json'
      - 'kernel/identifiers.json'
      - 'kernel/states.json'
      - 'kernel/state-machines.json'
      - 'kernel/relationships.json'
      - 'domains/ownership-map.json'
      - 'architecture/authority.json'
      - 'contracts/c32-learning-sessions-progress-contract.md'
      - 'src/modules/learning/**'
      - 'scripts/persistence/validate-slice-p05-owner-decisions.mjs'
      - 'scripts/persistence/validate-slice-p05-schema-admission.mjs'
      - 'scripts/persistence/validate-first-physical-slice-readiness.mjs'
      - 'scripts/persistence/audit-first-physical-slice-readiness.mjs'
      - 'scripts/tests/validate-validators.mjs'
      - '.github/workflows/slice-p05-schema-admission.yml'

permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        id: workflow_step_001
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        id: workflow_step_002
        with:
          node-version: '20'
      - name: Validate SLICE-P05 owner decision
        id: workflow_step_003
        run: node scripts/persistence/validate-slice-p05-owner-decisions.mjs
      - name: Validate SLICE-P05 schema admission
        id: workflow_step_004
        run: node scripts/persistence/validate-slice-p05-schema-admission.mjs
      - name: Validate physical-slice readiness
        id: workflow_step_005
        run: node scripts/persistence/validate-first-physical-slice-readiness.mjs
      - name: Audit whole-stack persistence state
        id: workflow_step_006
        run: node scripts/persistence/audit-first-physical-slice-readiness.mjs
      - name: Record workflow lifecycle checkpoint
        id: lifecycle_record
        if: always()
        env:
          LIFECYCLE_STEPS: ${{ toJson(steps) }}
          LIFECYCLE_JOB_STATUS: ${{ job.status }}
          LIFECYCLE_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          LIFECYCLE_WORKFLOW_PATH: .github/workflows/slice-p05-schema-admission.yml
        run: node scripts/verification/record-workflow-lifecycle.mjs
      - name: Retain workflow lifecycle evidence
        id: lifecycle_upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: verification/generated/workflow-lifecycle/report.json
          if-no-files-found: error
