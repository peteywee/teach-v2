name: Validate Apply Pins

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'drizzle/**'
      - 'persistence/**'
      - 'src/modules/**'
      - 'src/bootstrap/**'
      - 'kernel/*.json'
      - 'domains/ownership-map.json'
      - 'contracts/README.md'
      - 'contracts/APPROVAL-RECORD.md'
      - '.github/workflows/validate-apply-pins.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'drizzle/**'
      - 'persistence/**'
      - 'src/modules/**'
      - 'src/bootstrap/**'
      - 'kernel/*.json'
      - 'domains/ownership-map.json'
      - 'contracts/README.md'
      - 'contracts/APPROVAL-RECORD.md'
      - '.github/workflows/validate-apply-pins.yml'

permissions:
  contents: read

jobs:
  validate-pins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate live version and count pins
        run: node scripts/packaging/validate-apply-guards.mjs pins
      - name: Verify migration-history guard positive and negative paths
        run: node scripts/tests/validate-migration-history-guards.mjs
