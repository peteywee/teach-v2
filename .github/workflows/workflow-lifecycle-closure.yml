name: Workflow Lifecycle Closure
on:
  workflow_run:
    workflows:
      - "Application Interface Authority"
      - "Application Interface Discovery"
      - "Architecture Application Cross-Layer Audit"
      - "Architecture Application Persistence Audit"
      - "Architecture Authority"
      - "Architecture Discovery"
      - "Architecture Proposal"
      - "Command Event Discovery"
      - "Decision Table Discovery"
      - "Dependency Concepts"
      - "Dependency Lifecycle Discovery"
      - "Development Self Audit"
      - "Document Governance"
      - "Domain Ownership Discovery"
      - "First Physical Slice Readiness"
      - "Invariant Discovery"
      - "Persistence Authority"
      - "Persistence Discovery"
      - "Persistence Semantic Closure Discovery"
      - "Persistence Semantic Closure Proposal"
      - "Persistence Semantic Closure Registration"
      - "Production Proof Decisions"
      - "Relationship Discovery"
      - "SLICE-P01 Implementation"
      - "SLICE-P01 Relationship Promotion"
      - "SLICE-P02 Implementation"
      - "SLICE-P02 Owner Decisions"
      - "SLICE-P02 Schema Admission"
      - "SLICE-P03 Implementation"
      - "SLICE-P03 Schema Admission"
      - "SLICE-P04 Implementation"
      - "SLICE-P04 Schema Admission"
      - "SLICE-P05 Domain Application Foundation"
      - "SLICE-P05 Owner Decisions"
      - "SLICE-P05 Physical Implementation"
      - "SLICE-P05 Schema Admission"
      - "Semantic Kernel"
      - "State Discovery"
      - "Strict-Nine Governance Ratification"
      - "TransactionControl First Slice Decision Packet"
      - "TransactionControl First Slice Decision Registration"
      - "Validate Apply Pins"
      - "Validator Negative Paths"
      - "Whole Repository Integration Audit"
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  close-workflow:
    # Only attempt closure for runs on the default branch.
    # PR merge-ref provenance cannot be authoritatively proven (ephemeral merge ref),
    # so PR runs are skipped rather than BLOCKED. See PR #72 design.
    if: ${{ github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted default-branch observer source
        id: workflow_step_001
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Pin observer Node runtime
        id: workflow_step_002
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Read authoritative run and retained evidence
        id: workflow_step_003
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIFECYCLE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: timeout --signal=TERM --kill-after=2s 25s node scripts/verification/close-workflow-lifecycle.mjs "$GITHUB_REPOSITORY" --run "$LIFECYCLE_RUN_ID" verification/generated/workflow-closure
      - name: Retain independent closure evidence even on failure
        id: workflow_step_004
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-closure-${{ github.event.workflow_run.id }}-observer-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification/generated/workflow-closure/
          if-no-files-found: error
      - name: Record observer lifecycle checkpoint
        id: lifecycle_record
        if: always()
        env:
          LIFECYCLE_STEPS: ${{ toJson(steps) }}
          LIFECYCLE_JOB_STATUS: ${{ job.status }}
          LIFECYCLE_EXPECTED_SHA: ${{ github.sha }}
          LIFECYCLE_WORKFLOW_PATH: .github/workflows/workflow-lifecycle-closure.yml
        run: node scripts/verification/record-workflow-lifecycle.mjs
      - name: Retain observer evidence for independent terminal readback
        id: lifecycle_upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: verification/generated/workflow-lifecycle/report.json
          if-no-files-found: error
